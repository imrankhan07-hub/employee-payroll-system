<!DOCTYPE html>
<html>
<head>
  <title>Add Employee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
  <a href="index.html" class="navbar-brand">← Back</a>
  <span class="navbar-brand fw-bold">Add New Employee</span>
</nav>

<div class="container mt-4">

  <div class="card p-4 shadow" style="max-width:600px;margin:auto">

    <div class="row g-3">

      <div class="col-6">
        <label>Full Name</label>
        <input id="name" class="form-control" placeholder="Employee name"/>
      </div>

      <div class="col-6">
        <label>Email</label>
        <input id="email" type="email" class="form-control" placeholder="Email address"/>
      </div>

      <div class="col-6">
        <label>Department</label>
        <select id="department" class="form-select">
          <option>IT</option>
          <option>HR</option>
          <option>Finance</option>
          <option>Operations</option>
        </select>
      </div>

      <div class="col-6">
        <label>Designation</label>
        <input id="designation" class="form-control" placeholder="Job title"/>
      </div>

      <div class="col-6">
        <label>Basic Salary (₹)</label>
        <input id="basicSalary" type="number" class="form-control" placeholder="e.g. 30000"/>
      </div>

      <div class="col-6">
        <label>Phone</label>
        <input id="phone" class="form-control" placeholder="Phone number"/>
      </div>

      <div class="col-12">
        <label>Join Date</label>
        <input id="joinDate" type="date" class="form-control"/>
      </div>

      <div class="col-12">
        <!-- FIXED BUTTON -->
        <button type="button"
                onclick="addEmployee()"
                class="btn btn-warning w-100 fw-bold">
          💾 Save Employee
        </button>
      </div>

      <p id="msg" class="text-center mt-2"></p>

    </div>
  </div>

</div>

<!-- JS FILE -->
<script src="app.js"></script>

</body>
</html>
